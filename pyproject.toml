[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chitfund-app1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.2",
    "pymongo==4.5.0",
    "chitfund-app1 @ git+https://github.com/niteshnov2005/chitfund-app1.git@main"
]


[tool.setuptools.packages.find]
include = ["backend*"]  # This tells Python only to look at the 'backend' folder