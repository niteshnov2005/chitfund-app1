[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chitfund-main-app" # This is fine as the parent name
version = "0.1.0"

dependencies = [
    "flask==3.1.2",
    "pymongo==4.5.0",
    # Change the name here to match what uv found in the metadata
    "chitfund-main-app @ git+https://github.com/niteshnov2005/chitfund-app1.git@main"
]


[tool.setuptools.packages.find]
include = ["backend*"]  # This tells Python only to look at the 'backend' folder