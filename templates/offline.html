<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Chit Fund</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ecf0f1;
            --text-muted: #b0bec5;
            --accent: #3498db;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 20px;
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .wifi-icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }
        .wifi-icon .slash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            width: 110%;
            height: 4px;
            background-color: #e74c3c;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.8);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 10px 0;
        }
        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
            text-decoration: none;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.6);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wifi-icon">
            <i class="fas fa-wifi"></i>
            <div class="slash"></div>
        </div>
        <h1>No Internet Connection</h1>
        <p>Please check your connection and try again. Some features may not be available offline.</p>
        <button class="btn-retry" onclick="window.location.reload()"><i class="fas fa-sync-alt"></i> Try Again</button>
    </div>
</body>
</html>
