<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History - Chit Fund</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #667eea; --success: #48bb78; --danger: #f56565; }
        body { font-family: 'Segoe UI', sans-serif; background: #f7fafc; }
        .navbar { background: linear-gradient(135deg, var(--primary), #764ba2);
            padding: 20px 30px; color: white; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .navbar h1 { font-size: 1.5rem; }
        .navbar a { color: white; text-decoration: none; padding: 8px 20px;
            background: rgba(255,255,255,0.2); border-radius: 8px; border: 2px solid white; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .page-header { background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .page-header h2 { font-size: 2rem; margin-bottom: 10px; }
        .history-card { background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .history-card h3 { margin-bottom: 15px; color: var(--primary); }
        .stat-row { display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid #f1f1f1; }
        .stat-label { color: #666; }
        .stat-value { font-weight: 600; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; }
        .badge-success { background: #c6f6d5; color: #22543d; }
        .badge-danger { background: #fed7d7; color: #742a2a; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1><i class="fas fa-history"></i> Payment History</h1>
        <div style="display: flex; gap: 15px;">
            <a href="/user/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>My Payment History</h2>
            <p style="color: #666;">Complete history of all your payments</p>
        </div>

        <div id="history-list">
            <div style="text-align: center; padding: 30px;">Loading...</div>
        </div>
    </div>

    <script>
        async function loadHistory() {
            try {
                const response = await fetch('/api/user/payment-history');
                const history = await response.json();
                const container = document.getElementById('history-list');
                
                if (history && history.length > 0) {
                    container.innerHTML = history.map(h => `
                        <div class="history-card">
                            <h3>${h.sheet_name}</h3>
                            <div class="stat-row">
                                <span class="stat-label">Total Amount:</span>
                                <span class="stat-value">₹${h.amount.toLocaleString()}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Paid Amount:</span>
                                <span class="stat-value">₹${h.paid_amount.toLocaleString()}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Status:</span>
                                <span class="badge badge-${h.is_paid ? 'success' : 'danger'}">
                                    ${h.is_paid ? 'Fully Paid' : 'Pending'}
                                </span>
                            </div>
                            ${h.paid_date ? `
                            <div class="stat-row">
                                <span class="stat-label">Paid On:</span>
                                <span class="stat-value">${h.paid_date}</span>
                            </div>
                            ` : ''}
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="history-card"><p style="text-align: center; color: #666;">No payment history found</p></div>';
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }
        loadHistory();
    </script>
</body>
</html>
