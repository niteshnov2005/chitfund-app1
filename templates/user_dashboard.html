<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Chit Fund</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #667eea; --secondary: #764ba2; --success: #48bb78;
            --danger: #f56565; --warning: #ed8936; --dark: #2d3748; --light: #f7fafc;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); }
        .navbar { background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 20px 30px; color: white; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .navbar h1 { font-size: 1.5rem; }
        .navbar-right { display: flex; gap: 20px; align-items: center; }
        .btn-logout { padding: 8px 20px; background: rgba(255,255,255,0.2);
            color: white; border: 2px solid white; border-radius: 8px;
            text-decoration: none; transition: all 0.3s; }
        .btn-logout:hover { background: white; color: var(--primary); }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .welcome-card { background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px;
            text-align: center; }
        .welcome-card h2 { font-size: 2rem; color: var(--dark); margin-bottom: 10px; }
        .welcome-card p { color: #718096; font-size: 1.1rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h3 { font-size: 0.9rem; color: #718096; margin-bottom: 10px; }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: var(--dark); }
        .stat-card.success .value { color: var(--success); }
        .stat-card.danger .value { color: var(--danger); }
        .stat-card.warning .value { color: var(--warning); }
        .payment-items { background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .payment-items h2 { margin-bottom: 20px; font-size: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: var(--light);
            font-weight: 600; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #f1f1f1; }
        tr:hover { background: #fafafa; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
        .badge-success { background: #c6f6d5; color: #22543d; }
        .badge-danger { background: #fed7d7; color: #742a2a; }
        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 15px; text-align: center; }
            .stats-grid { grid-template-columns: 1fr; }
            table { font-size: 0.85rem; }
            th, td { padding: 8px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1 data-testid="user-dashboard-title"><i class="fas fa-coins"></i> My Chit Fund Account</h1>
        <div class="navbar-right">
            <span id="user-name" data-testid="user-name">Loading...</span>
            <a href="/logout" class="btn-logout" data-testid="user-logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <h2 data-testid="welcome-message">Welcome back!</h2>
            <p>Here's an overview of your chit fund account</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Due Amount</h3>
                <div class="value" id="total-due" data-testid="total-due">₹0</div>
            </div>
            <div class="stat-card success">
                <h3>Amount Paid</h3>
                <div class="value" id="paid-amount" data-testid="paid-amount">₹0</div>
            </div>
            <div class="stat-card danger">
                <h3>Pending Amount</h3>
                <div class="value" id="pending-amount" data-testid="pending-amount">₹0</div>
            </div>
            <div class="stat-card warning">
                <h3>Payment Status</h3>
                <div class="value" id="payment-status" data-testid="payment-status" style="font-size: 1.5rem;">-</div>
            </div>
        </div>

        <div class="payment-items">
            <h2>Payment Breakdown</h2>
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Plan</th>
                        <th>Commission</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="payment-items-tbody">
                    <tr><td colspan="5" style="text-align: center; padding: 20px;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('/api/user/dashboard');
                const data = await response.json();

                document.getElementById('user-name').textContent = data.name;
                document.getElementById('total-due').textContent = '₹' + data.total_due.toLocaleString();
                document.getElementById('paid-amount').textContent = '₹' + data.paid_amount.toLocaleString();
                document.getElementById('pending-amount').textContent = '₹' + data.pending_amount.toLocaleString();
                document.getElementById('payment-status').textContent = data.is_paid ? 'Fully Paid ✓' : 'Pending';

                const tbody = document.getElementById('payment-items-tbody');
                if (data.items && data.items.length > 0) {
                    tbody.innerHTML = data.items.map(item => `
                        <tr>
                            <td>${item.month}</td>
                            <td>${item.plan}</td>
                            <td>${item.commission || '-'}</td>
                            <td>₹${item.amount.toLocaleString()}</td>
                            <td><span class="badge badge-${item.is_paid ? 'success' : 'danger'}">
                                ${item.is_paid ? 'Paid' : 'Pending'}</span></td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px;">No payment items found</td></tr>';
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
