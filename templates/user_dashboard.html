<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - ChitFund</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a1f; color: #fff; }
        .navbar { background: linear-gradient(135deg, #a855f7, #d946ef); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3); }
        .navbar h1 { font-size: 24px; display: flex; align-items: center; gap: 12px; }
        .navbar-right { display: flex; gap: 20px; align-items: center; }
        .btn-logout { padding: 10px 24px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 10px; color: white; text-decoration: none; transition: all 0.3s; }
        .btn-logout:hover { background: white; color: #a855f7; }
        .container { max-width: 1400px; margin: 40px auto; padding: 0 40px; }
        .welcome-card { background: rgba(26, 26, 46, 0.6); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 16px; padding: 30px; margin-bottom: 30px; text-align: center; }
        .welcome-card h2 { font-size: 32px; margin-bottom: 10px; }
        .welcome-card p { color: #9ca3af; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(26, 26, 46, 0.6); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 16px; padding: 24px; transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-5px); border-color: rgba(168, 85, 247, 0.4); }
        .stat-title { color: #9ca3af; font-size: 13px; text-transform: uppercase; margin-bottom: 10px; }
        .stat-value { font-size: 32px; font-weight: 700; }
        .stat-card.success .stat-value { color: #22c55e; }
        .stat-card.danger .stat-value { color: #ef4444; }
        .stat-card.warning .stat-value { color: #f97316; }
        .payment-section { background: rgba(26, 26, 46, 0.6); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 16px; padding: 30px; }
        .section-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: rgba(15, 15, 35, 0.6); border-bottom: 2px solid rgba(168, 85, 247, 0.2); }
        td { padding: 12px; border-bottom: 1px solid rgba(168, 85, 247, 0.1); }
        tr:hover { background: rgba(168, 85, 247, 0.05); }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-success { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1><i class="fas fa-coins"></i> My ChitFund Account</h1>
        <div class="navbar-right">
            <span id="user-name">Loading...</span>
            <a href="/logout" class="btn-logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <h2>Welcome back!</h2>
            <p>Here's an overview of your chit fund account</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Due Amount</div>
                <div class="stat-value" id="total-due">₹0</div>
            </div>
            <div class="stat-card success">
                <div class="stat-title">Amount Paid</div>
                <div class="stat-value" id="paid-amount">₹0</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-title">Pending Amount</div>
                <div class="stat-value" id="pending-amount">₹0</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-title">Payment Status</div>
                <div class="stat-value" id="payment-status" style="font-size: 24px;">-</div>
            </div>
        </div>

        <div class="payment-section">
            <div class="section-title">Payment Breakdown</div>
            <table>
                <thead>
                    <tr><th>Month</th><th>Plan</th><th>Commission</th><th>Amount</th><th>Status</th></tr>
                </thead>
                <tbody id="payment-items-tbody">
                    <tr><td colspan="5" style="text-align: center; padding: 20px;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('/api/user/dashboard');
                const data = await response.json();
                document.getElementById('user-name').textContent = data.name;
                document.getElementById('total-due').textContent = '₹' + data.total_due.toLocaleString();
                document.getElementById('paid-amount').textContent = '₹' + data.paid_amount.toLocaleString();
                document.getElementById('pending-amount').textContent = '₹' + data.pending_amount.toLocaleString();
                document.getElementById('payment-status').textContent = data.is_paid ? 'Fully Paid ✓' : 'Pending';

                const tbody = document.getElementById('payment-items-tbody');
                if (data.items && data.items.length > 0) {
                    tbody.innerHTML = data.items.map(item => `
                        <tr>
                            <td>${item.month}</td>
                            <td>${item.plan}</td>
                            <td>${item.commission || '-'}</td>
                            <td>₹${item.amount.toLocaleString()}</td>
                            <td><span class="badge badge-${item.is_paid ? 'success' : 'danger'}">${item.is_paid ? 'Paid' : 'Pending'}</span></td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px;">No payment items found</td></tr>';
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }
        loadDashboard();
    </script>
</body>
</html>
