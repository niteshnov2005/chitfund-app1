<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Members - ChitFund</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a1f; color: #fff; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 240px; background: rgba(15, 15, 35, 0.8); border-right: 1px solid rgba(168, 85, 247, 0.1); padding: 20px 0; z-index: 1000; }
        .sidebar-logo { display: flex; align-items: center; gap: 12px; padding: 0 20px 30px; border-bottom: 1px solid rgba(168, 85, 247, 0.1); }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #a855f7, #d946ef); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .logo-text { font-size: 20px; font-weight: 700; }
        .sidebar-menu { padding: 30px 0; }
        .menu-item { display: flex; align-items: center; gap: 15px; padding: 14px 20px; color: #9ca3af; text-decoration: none; transition: all 0.3s; margin: 0 10px 5px; border-radius: 10px; }
        .menu-item:hover, .menu-item.active { background: rgba(168, 85, 247, 0.1); color: #fff; }
        .menu-item.active { background: linear-gradient(135deg, #a855f7, #d946ef); }
        .menu-item i { width: 20px; }
        .main-content { margin-left: 240px; min-height: 100vh; background: linear-gradient(135deg, #0a0a1f 0%, #1a1a2e 100%); }
        .topbar { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 15, 35, 0.6); border-bottom: 1px solid rgba(168, 85, 247, 0.1); }
        .page-title { font-size: 28px; font-weight: 700; }
        .btn { padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #a855f7, #d946ef); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .content { padding: 40px; }
        .search-bar { display: flex; gap: 15px; margin-bottom: 25px; }
        .search-bar input, .search-bar select { padding: 12px 20px; background: rgba(26, 26, 46, 0.6); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 10px; color: white; font-size: 14px; }
        .search-bar input { flex: 1; }
        .members-table { background: rgba(26, 26, 46, 0.6); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 16px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(15, 15, 35, 0.6); padding: 15px; text-align: left; font-weight: 600; border-bottom: 2px solid rgba(168, 85, 247, 0.2); }
        td { padding: 15px; border-bottom: 1px solid rgba(168, 85, 247, 0.1); }
        tr:hover { background: rgba(168, 85, 247, 0.05); }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-success { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-warning { background: rgba(249, 115, 22, 0.2); color: #f97316; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: rgba(26, 26, 46, 0.95); border: 1px solid rgba(168, 85, 247, 0.3); padding: 30px; border-radius: 16px; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 25px; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #9ca3af; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #d1d5db; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: rgba(15, 15, 35, 0.6); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 10px; color: white; }
        .action-buttons { display: flex; gap: 10px; }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .logout-btn { position: fixed; bottom: 20px; left: 20px; width: 200px; padding: 12px 20px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 10px; color: #fca5a5; text-decoration: none; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fas fa-coins"></i></div>
            <div class="logo-text">ChitFund</div>
        </div>
        <nav class="sidebar-menu">
            <a href="/admin/dashboard" class="menu-item"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
            <a href="/admin/members" class="menu-item active"><i class="fas fa-users"></i><span>Members</span></a>
            <a href="/admin/auctions" class="menu-item"><i class="fas fa-gavel"></i><span>Auctions</span></a>
            <a href="/admin/reports" class="menu-item"><i class="fas fa-chart-line"></i><span>Reports</span></a>
            <a href="/admin/users" class="menu-item"><i class="fas fa-user-cog"></i><span>User Accounts</span></a>
        </nav>
        <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i><span>Log Out</span></a>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <div class="page-title">Members Management</div>
            <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> Add Member</button>
        </div>

        <div class="content">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search by name or area...">
                <select id="sheet-select" class="btn">
                    <option>Loading sheets...</option>
                </select>
            </div>

            <div class="members-table">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th><th>Area</th><th>Phone</th><th>Total</th><th>Paid</th><th>Status</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="members-tbody">
                        <tr><td colspan="7" style="text-align: center; padding: 30px;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="member-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Member</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="member-form" onsubmit="saveMember(event)">
                <input type="hidden" id="member-id">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="member-name" required>
                </div>
                <div class="form-group">
                    <label>Area *</label>
                    <input type="text" id="member-area" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="member-phone">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">Save Member</button>
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentSheet = '';
        let allMembers = [];

        async function loadSheets() {
            const response = await fetch('/api/sheets');
            const sheets = await response.json();
            const select = document.getElementById('sheet-select');
            select.innerHTML = sheets.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
            if (sheets.length > 0) {
                currentSheet = sheets[0].name;
                loadMembers();
            }
        }

        document.getElementById('sheet-select').addEventListener('change', (e) => {
            currentSheet = e.target.value;
            loadMembers();
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderMembers(allMembers.filter(m => 
                m.name.toLowerCase().includes(term) || m.area.toLowerCase().includes(term)
            ));
        });

        async function loadMembers() {
            const response = await fetch(`/api/admin/members?sheet=${currentSheet}`);
            allMembers = await response.json();
            renderMembers(allMembers);
        }

        function renderMembers(members) {
            const tbody = document.getElementById('members-tbody');
            if (members.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px;">No members found</td></tr>';
                return;
            }

            tbody.innerHTML = members.map(m => `
                <tr>
                    <td>${m.name}</td>
                    <td>${m.area}</td>
                    <td>${m.phone || '-'}</td>
                    <td>₹${m.total.toLocaleString()}</td>
                    <td>₹${m.paid_amount.toLocaleString()}</td>
                    <td><span class="badge badge-${m.is_paid ? 'success' : (m.paid_amount > 0 ? 'warning' : 'danger')}">
                        ${m.is_paid ? 'Paid' : (m.paid_amount > 0 ? 'Partial' : 'Pending')}</span></td>
                    <td class="action-buttons">
                        <button class="btn btn-sm btn-primary" onclick="togglePayment('${m.id}')">
                            ${m.is_paid ? 'Unpay' : 'Mark Paid'}
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function openAddModal() {
            document.getElementById('modal-title').textContent = 'Add Member';
            document.getElementById('member-form').reset();
            document.getElementById('member-id').value = '';
            document.getElementById('member-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('member-modal').classList.remove('active');
        }

        async function saveMember(event) {
            event.preventDefault();
            const data = {
                name: document.getElementById('member-name').value,
                area: document.getElementById('member-area').value,
                phone: document.getElementById('member-phone').value
            };
            await fetch('/api/admin/members', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            closeModal();
            loadMembers();
        }

        async function togglePayment(memberId) {
            await fetch('/api/admin/toggle-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ member_id: memberId, sheet_name: currentSheet })
            });
            loadMembers();
        }

        loadSheets();
    </script>
</body>
</html>
